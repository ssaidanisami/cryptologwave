spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:prod-db.cryptologwave.internal}:${DB_PORT:3306}/${DB_NAME:cryptologwave_prod}?createDatabaseIfNotExist=false&useSSL=true&requireSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:cryptolog_prod_user}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      keepalive-time: 30000
      pool-name: ProdHikariPool

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://auth.cryptologwave.com/realms/cryptolog}

server:
  shutdown: graceful

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: WARN
    com.cryptolog.wave: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.liquibase: INFO
